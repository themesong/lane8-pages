4-miler in noon August heat, and now a 15.2 at 8:35 with heart rate never averaging over 149 — put sub-4 at roughly 85/15 and a realistic 3:48–3:52. And Nov 1 is not unknown territory: you have finished this exact race twice — 4:32:25 in 2023, and 4:32:25 again in 2024, identical to the second (official results; you've been remembering it as 4:24:32 — the digits swapped somewhere along the way). We checked the full archive: 8,426 people ran both years and exactly seven matched their time to the second. You're one of them. Sub-4 isn't a leap into the dark. It's a 32-minute PR attempt, and the difference this time is the build behind it: the engine above, easy days run easy, a pacing plan, and a fueling protocol rehearsed before you get to Staten Island.<\/p><p>What is left is not building a different runner — it is rehearsing the one that exists, and every piece is in your hands: easy days actually easy (three in a row now, after a summer of zero), long-run finishes controlled (done, as of Aug 29), sleep at 7+ (still the weak spot at 6.5 average), and teaching your gut 80g/hr (starts with the 16). None of those needs more than 64 days. All of them need the next 64 days.<\/p><p>One more thing we now know that we didn't a week ago: exactly what capped the old races. Both 4:24s came apart the same way — a groin cramp off a bridge climb at the same spot, then the cascade. That is not a mystery to respect; it is a mechanism to train against, and every piece of this build — the mileage, the fueling, the sodium, and now hills inside the long runs — is pointed straight at it.<\/p>"},"data":{"title":"What the data says","intro":"<p>Everything here is from your Whoop export and run screenshots. Hover anything for the numbers.<\/p>","figures":[{"id":"fig-zones","kind":"zonebars","title":"Easy means easy: time in each HR zone, recent runs","sub":"Whoop zones · Z1 105–134 · Z2 135–148 · Z3 149–162 · Z4 163–177 · Z5 178+. An easy day should be almost entirely the two light bands." ,["03-02",256],["03-09",152],["03-16",106],["03-23",204],["03-30",221],["04-06",100],["04-13",287],["04-20",320],["04-27",193],["05-04",274],["05-11",295],["05-18",0],["05-25",102],["06-01",80],["06-08",93],["06-15",89],["06-22",122],["06-29",0],["07-06",100],["07-13",36],["07-20",197],["07-27",183],["08-03",191],["08-10",191],["08-17",291],["08-24",137]],"month_marks":[[0,"Jan"],[4,"Feb"],[8,"Mar"],[13,"Apr"],[17,"May"],[21,"Jun"],[26,"Jul"],[30,"Aug"]],"annotations":[{"x":18.5,"y":320,"text":"April: 17 runs","dy":-6,"anchor":"middle"},{"x":24.5,"y":130,"text":"summer","dy":-6,"anchor":"middle"}]},{"id":"fig-sleep","kind":"sleep_recovery","title":"Sleep the night before vs. next-morning recovery, last 8 weeks","sub":"Each dot is one night. Under 6 hours, recovery is almost never green. The night after the 14-miler: 4.5 hours, 28%.","data":[[422,42],[455,60],[342,40],[385,53],[411,75],[359,33],[290,41],[238,29],[366,79],[405,48],[333,53],[347,75],[396,73],[441,74],[404,33],[338,46],[292,57],[335,53],[327,56],[425,45],[435,55],[347,21],[370,84],[387,37],[429,93],[457,73],[417,32],[405,69],[345,61],[409,44],[326,63],[379,35],[341,58],[395,50],[459,80],[303,36],[412,94],[296,36],[395,91],[343,68],[418,75],[495,80],[346,71],[380,41],[338,73],[463,79],[395,37],[374,56],[454,94],[315,40],[438,92],[371,45],[397,40],[481,62],[273,28,"Aug 23 · after the 14-miler"],[495,93,"Aug 24 · before the threshold"]],"annotations":[{"x":273,"y":28,"text":"after the 14-miler","dx":10}]}]},"rules":{"title":"The rules","items":[{"strong":"Heart rate governs, pace follows.","text":"Every run has an HR cap. If pace is slow at the cap, pace is slow. Heat and hills raise HR at the same pace; that's the point of running by HR."},{"strong":"Easy means easy.","text":"Easy runs at or under 150, aiming 135–145. The day after quality, under 145. Most of the week lives here; this is where the marathon gets built."},{"strong":"Long runs finish under 155.","text":"They are rehearsals, not fitness tests. If HR reaches 155 in the last miles, slow down. Negative split by feel, not by effort spike."},{"strong":"One quality day a week.","text":"Threshold at 165–172 with a hard stop at 172, or a marathon-effort block at 150–155. Not both. Never within 72 hours of a long run."},{"strong":"Long runs before 9 AM.","text":"Same time of day as the race. No exceptions from September on."},{"strong":"Fuel at race dosing on every long run.","text":"80 g carbs per hour (2 Maurten 160 per hour), 300–500 mg sodium per hour. Nothing on race day that hasn't been used on a long run."},{"strong":"Sleep is part of the plan.","text":"7+ hours the two nights before every long run. The scatter above is why."},{"strong":"Lifting: keep the weight, cut the sets.","text":"No lower-body lifting within 48 hours of a long run."},{"strong":"Say it early.","text":"Legs, motivation, sleep, schedule: raising it early is the strong move. A recovery week pulled forward is cheap; a missed month is not."}]},"zones":{"title":"Heart rate zones","intro":"<p>Built on an HRmax of ~192 (191 seen at the end of Brooklyn; the wrist has shown 193+ on eight runs since March 2025, so these are slightly conservative). The chest strap will confirm. Race pacing uses the strap, not the wrist.<\/p>","cards":[{"cls":"easy","k":"Easy / long run","v":"≤150","s":"aim 135–145 · finish long runs ≤155"},{"cls":"mp","k":"Marathon effort","v":"150–155","s":"race-day HR through mile 20"},{"cls":"thr","k":"Threshold","v":"165–172","s":"hard stop at 172"},{"cls":"","k":"Mile 20 decision","v":"&lt;152","s":"if HR is under 152 at 20, push"}]},"calendar":{"title":"Calendar","toc":"Calendar","intro":"Three weeks at a time, updated as runs come in. Week 3 is a planned pull-back; it sets up the first 18-miler on Sept 19/20.","weeks":[{"title":"Week of Aug 24","tot":"~34 mi · long run 15.2","rows":[{"day":"Tue 8/25","run":"8 mi · 2 WU / ~6 work / 0 CD <span class=\"pill p-thr\">threshold<\/span>","hr":"165–172","notes":"Ran it 3:30 PM. Work block ran long (6 mi vs 4) but stopped at 172 exactly.","done":true},{"day":"Wed 8/26","run":"5 mi <span class=\"pill p-easy\">easy<\/span>","hr":"≤145","notes":"84% in Z1. This is the standard.","done":true},{"date":"2026-08-27","day":"Thu 8/27","run":"6 mi <span class=\"pill p-easy\">easy<\/span>","hr":"≤150","notes":"6.04 mi · 8:36 · 135 avg. Second correct easy run in a row.","done":true},{"date":"2026-08-28","day":"Fri 8/28","run":"<span class=\"pill p-off\">off<\/span>","hr":"","notes":"Walk fine. 7+ h sleep tonight and Saturday."},{"date":"2026-08-29","day":"Sat 8/29","key":true,"run":"<strong>15.2 mi long<\/strong> <span class=\"pill p-easy\">easy<\/span>","hr":"≤152 · finish ≤155","notes":"15.2 · 8:35 avg · ~136 avg HR · 6:05 AM start. Every rule met.","done":true},{"date":"2026-08-30","day":"Sun 8/30","run":"<span class=\"pill p-off\">off<\/span>","hr":"","notes":""}]},{"title":"Week of Aug 31 · Naples trip","tot":"~37 mi · long run 16 (Fri)","rows":[{"date":"2026-08-31","day":"Mon 8/31","run":"6 mi <span class=\"pill p-easy\">easy<\/span>","hr":"≤145","notes":"6.0 mi outdoors · 9:30/mi · ~125 avg, 97% Z1. Done as written. (Last night's 'treadmill 5' read was a Strava sync glitch.)","done":true},{"date":"2026-09-01","day":"Tue 9/1","run":"7 mi · 2 WU / 4 @ threshold / 1 CD <span class=\"pill p-thr\">threshold<\/span>","hr":"165–172","notes":"Ran as 1 WU / 5-mi progression 7:52→7:11 (HR to 161) / 1 CD — not the 2/4/1. Cap respected, first real cool-down. See review.","done":true},{"date":"2026-09-02","day":"Wed 9/2","run":"4 mi <span class=\"pill p-easy\">easy<\/span>","hr":"≤145","notes":"Missed — rough day, flagged same-day (that's the right move). Ran Thursday instead.","done":false},{"date":"2026-09-03","day":"Thu 9/3","run":"4 mi <span class=\"pill p-easy\">easy<\/span> (moved from Wed)","hr":"≤145","notes":"4.29 · 8:22 · 138 avg · 217 ft of hills, 8:51 AM. One tempo surge in mile 3 — easy days don't have those. Rest day spent: sleep is tonight's job.","done":true},{"date":"2026-09-04","day":"Fri 9/4","key":true,"run":"<strong>16 mi long<\/strong> <span class=\"pill p-easy\">easy<\/span>","hr":"≤152 · finish ≤155","notes":"12.01 · 8:51 · 143 avg, max 157 · 335 ft · 92% humidity. Stopped at 12 with both calves going — the right call. See review.","done":"<span class=\"pill p-warn\">12 of 16<\/span>"},{"date":"2026-09-05","day":"Sat 9/5","run":"<span class=\"pill p-off\">off<\/span> · walk only · Naples","hr":"","notes":"Calves get 48 h. No running until Monday. Any tightness Sat/Sun — say so before Monday."},{"date":"2026-09-06","day":"Sun 9/6","run":"<span class=\"pill p-off\">off<\/span>","hr":"","notes":"Pull-back week starts Monday."}]},{"title":"Week of Sep 7 · pull-back","tot":"13 mi · long run missed","pull":true,"rows":[{"date":"2026-09-07","day":"Mon 9/7","run":"<span class=\"pill p-off\">off<\/span>","hr":"","notes":"Planned down week. Absorb the last three."},{"date":"2026-09-08","day":"Tue 9/8","run":"6 mi · 2 easy / 3 @ marathon effort / 1 easy <span class=\"pill p-mp\">marathon effort<\/span>","hr":"150–155","notes":"1 WU / 4 @ 7:48 / 1 CD. Two miles in the 150–155 rung, last one drifted to 159. Warm-up was 1, not 2 — take the second mile while the calves are fresh off a cramp.","done":true},{"date":"2026-09-09","day":"Wed 9/9","run":"4 mi <span class=\"pill p-easy\">easy<\/span>","hr":"≤145","notes":"Missed — too busy.","done":false},{"date":"2026-09-10","day":"Thu 9/10","run":"5 mi <span class=\"pill p-easy\">easy<\/span>","hr":"≤150","notes":"Missed — too busy.","done":false},{"date":"2026-09-11","day":"Fri 9/11","run":"<span class=\"pill p-off\">off<\/span>","hr":"","notes":""},{"date":"2026-09-12","day":"Sat 9/12","run":"<strong>13 mi long<\/strong> <span class=\"pill p-easy\">easy<\/span>","hr":"≤150","notes":"Missed — too busy.","done":false},{"date":"2026-09-13","day":"Sun 9/13","run":"7.25 mi <span class=\"pill p-easy\">easy<\/span> (unplanned)","hr":"≤150","notes":"Evening, flat. 8:18s at 133–142 — best pace-at-HR on record. Good run; the problem is it was the only one since Tuesday.","done":true}]},{"title":"Week of Sep 14","tot":"~32 mi · long run done Mon (13.1)","rows":[{"date":"2026-09-14","day":"Mon 9/14","run":"<strong>13.1 mi long<\/strong> <span class=\"pill p-easy\">easy<\/span> (ran the missed 13 instead of the easy 5)","hr":"≤155","notes":"8:31–8:39 every mile, HR 138 → 154, nothing over the cap. Titled it \"13 under 155.\" Exactly right.","done":true,"key":true},{"date":"2026-09-15","day":"Tue 9/15","run":"<span class=\"pill p-off\">off<\/span>","hr":"","notes":"Day after a 13. Earned. The ladder moves to Thursday."},{"date":"2026-09-16","day":"Wed 9/16","run":"5 mi <span class=\"pill p-easy\">easy<\/span>","hr":"≤145","notes":"5.01 · 8:34 · 131 avg, max 142. \"5 under 145.\" Done as written.","done":true},{"date":"2026-09-17","day":"Thu 9/17","run":"6 mi · 2 WU / 3 @ marathon effort / 1 CD <span class=\"pill p-mp\">MP<\/span>","hr":"150–155","notes":"2 / 3 / 1 exactly as written — first time. Block 7:07 / 7:09 / 7:20 at 148 / 152 / 155 in 84°F. Paces don't match the HR — see review.","done":true},{"date":"2026-09-18","day":"Fri 9/18","run":"<span class=\"pill p-off\">off<\/span>","hr":"","notes":"7+ hours tonight."},{"date":"2026-09-19","day":"Sat 9/19","key":false,"run":"8 mi <span class=\"pill p-easy\">easy<\/span>","hr":"≤150","notes":"Not 14, and not 15–16 either. Monday's 13.1 was this week's long run. Next: 15 on the 26th, 17 on the 3rd. The 20 on Oct 10 is yours if the next two weeks are complete — five runs each."},{"date":"2026-09-20","day":"Sun 9/20","run":"<span class=\"pill p-off\">off<\/span>","hr":"","notes":""}]}]},"road":{"title":"The road to Nov 1","toc":"Road to Nov 1","figure":{"id":"fig-long","kind":"longrun","pad":8,"taper_at":9.5,"title":"Long-run progression","sub":"Filled bars are done. Outlined bars are planned. 15, 17, then the Oct 10 peak: 18 by default — 20 if the weeks of Sep 21 and Sep 28 are both complete (five runs each, nothing missed). Then the Oct 17 half at marathon effort, then taper.","data":[["Aug 16",12.2,"done"],["Aug 23",14,"done"],["Aug 29",15.2,"done"],["Sep 4",12,"done"],["Sep 14",13.1,"done"],["Sep 19",8,"plan"],["Sep 26",15,"prov"],["Oct 3",17,"prov"],["Oct 10",18,"prov"],["Oct 17",13.1,"race"],["Oct 24",10,"prov"],["Nov 1",26.2,"race"]]},"bullets":["Weekly volume: ~34 now → 35–40 by late September, no week up more than ~10%, a down week every 3rd–4th.","Running days: 3 → 4 → 5. Extra days are short and easy; they're what lets the long run stay under 35–40% of the week.","Final three long runs are full race rehearsals: gear, breakfast, gels, start time, pacing.","Taper: three weeks. Volume comes down, one short sharp session per week stays in, visualization work starts.","Oct 17: NYCRUNS Falling Leaves Half, Prospect Park — confirmed. Run AT marathon effort (150–155), not raced. Park loops mean a real climb every lap on tiring legs: that's the '23/'24 failure scenario, rehearsed on purpose, two weeks before the Queensboro. 7:30 AM start doubles as the full race-morning rehearsal: alarm, breakfast, arrival at 5:30, corral time. We may open the last 2 miles to capture true HRmax; decision after the 20."]},"reviews":{"title":"Run reviews","intro":"<p>Newest first. Each entry: what happened, what it means, what changes.<\/p>","entries":[{"date":"Thu Sep 17","title":"MP ladder — the structure, finally; the numbers, a question","nums":"6.10 mi · 2 WU / 3 @ 7:07–7:20 / 1 CD · block HR 148 → 152 → 155 · 84°F","pill":{"cls":"p-warn","text":"right shape — check the strap"},"html":"<p>Two up, three on, one down, with a real warm-up and a real cool-down. That's the session as written, for the first time in five tries, and the heart-rate column says you sat in the rung: 148, 152, 155. Good.<\/p><p>Now the honest part. Those three miles were 7:07, 7:09 and 7:20 — in 84-degree heat. Nine days ago the same heart rate gave you 7:48 in cooler air, and last night 138 bought you 8:15; today 138 bought 7:55. Strava flagged your third-fastest 5K ever inside a marathon-effort block. That's not what marathon effort looks like, and fitness doesn't jump 8% in nine days. The likeliest explanation is the strap reading low — the trace shows contact dropouts through the first mile and a half, which usually means it was dry or loose at the start. If the strap was flattering you, the block was really run somewhere north of 160, which is a tempo, not a rehearsal.<\/p><p>So three quick things: send the Whoop trace for this run so we can compare; was the strap wet and seated before you started; and who's John M — were you two pulling each other? No wrong answers. If Whoop agrees with the strap, you just showed me something big and we'll re-plan around it. If it doesn't, the rule stands as always: the rung is the session.<\/p><p>Friday off. Saturday is 8 easy — after that block in that heat, the easy 8 is the point, not a formality.<\/p><p><strong>Update:<\/strong> got the Whoop trace — it's flat at 147 from the second minute to the last, through the warm-up, the 7:07 mile and the cool-down alike. That's a sensor stuck, not a heart rate, so it can't settle anything. The paces stay unverified for now, and the calendar will answer it for us: Saturday the 26th is 15 miles at 152 or under, strap wet and seated. Two hours at that heart rate tells the truth. If it's 7:40s, we re-plan the race; if it's 8:20s, Thursday was the strap. Either way, nothing to do differently this week.<\/p>"},{"date":"Wed Sep 16","title":"\"5 under 145\" — easy day, done","nums":"5.01 mi · 8:34 · 131 avg HR · max 142 · 78°F","pill":{"cls":"p-good","text":"as written"},"html":"<p>Cap was 145; you never got past 142. Eighty-five percent of the run in the endurance zone on a warm evening, and you named it after the rule again. Nothing to fix.<\/p><p>One small thing to file away, not change tonight: your easy runs all turn into ladders now — 9:17 down to 8:15. Under the cap that's fine. But easy days are meant to be flat effort start to finish; save the climbing instinct for Thursday, where it belongs. Thursday: 2 up, 3 at 150–155, 1 down — full warm-up, sit in the rung.<\/p>"},{"date":"Mon Sep 14","title":"\"13 under 155\" — the assignment, exactly","nums":"13.11 mi · 8:36 avg · 145 avg HR · max 157 · 8:31–8:39 for twelve straight miles","pill":{"cls":"p-good","text":"this is the standard"},"html":"<p>Twelve straight miles between 8:31 and 8:39, heart rate climbing smoothly from 138 to 154 and never touching the cap, and you named the run after the rule. That's not a good run — that's the marathon, shrunk to half distance. Even effort, HR-governed, finished with control. And you went and got the long run we lost last week without being asked. That's the whole build in one afternoon.<\/p><p>One consequence you're not going to love: Saturday is 8 easy, not 14. Monday's 13.1 is this week's long run. Two runs over 13 miles four days apart, on top of Sunday's 7, in the week after a 13-mile week — that's how calves turn into a problem, and I'm not trading Nov 1 for one Saturday. The next long run is 15 on the 26th, then 17, then an 18 on Oct 10 as the peak. The 20 is off the table; the 18 is plenty for what we're doing.<\/p><p>Rest of the week: Tuesday off, Wednesday 5 easy, Thursday the ladder (2 up, 3 at 150–155, 1 down — moved from Tuesday, full warm-up), Friday off, Saturday 8 easy, Sunday off.<\/p><p>Two things: next time you move a long run, text me first — the answer would've been yes and I'd have fixed Saturday for you on the spot. And what did you fuel and drink today over 1:53? Still need that from every long run.<\/p><p><strong>On adding 1–2 miles:<\/strong> no — and it felt easy because it's supposed to. The long runs stay 15 and 17. What you can earn is the 20: run the next two weeks complete, five runs each, nothing skipped, and Oct 10 goes from 18 to 20. Same miles you're asking for, earned the way that gets you to the start line healthy.<\/p>"},{"date":"Sun Sep 13","title":"Evening 7.25 — great run, missing week","nums":"7.25 mi · 8:30 avg · 136 avg HR · max 146 · 1 WU / 5 @ 8:15–8:20 / 1 CD","pill":{"cls":"p-warn","text":"the run was right; the week wasn't"},"html":"<p>Take the run on its own first: 8:15–8:20 miles at 133–142, never above 146, no drift, proper warm-up and cool-down. That's the best pace you've ever run at that heart rate — a month ago the same effort was 8:36. The engine keeps getting better. Nothing to fix here.<\/p><p>Now the week. Tuesday and tonight — two runs, 13 miles, and the Saturday long run didn't happen. I know the week got away from you, and that happens. But seven weeks out, this is the one thing I need you to hear: the risk to November 1st isn't your fitness anymore. It's the calendar. Long runs build on each other, and when a link goes missing the next one has to shrink — so Saturday is 14, not 16, because the longest you've run in three weeks is 12. That's a real cost, and it's the only reason the 20-miler is now a maybe instead of a lock.<\/p><p>Two asks, both simple. Put the runs in your calendar like meetings — the long run pinned Saturday morning. And when a week is going sideways, tell me <em>before<\/em> the miss, not after. If you'd texted Thursday, we'd have moved the 13 to Sunday and you'd have run it tonight instead of this. Early is the strong move.<\/p><p>This week: Mon 5, Tue the ladder (full warm-up, sit in 150–155), Wed 4, Thu 6 flat, Fri off, Sat 14 with gels and sodium, Sun off. Five runs. That's the whole assignment.<\/p>"},{"date":"Tue Sep 8","title":"Marathon-effort touch — 4 @ 7:48","nums":"6.1 mi · block 7:49 / 7:48 / 7:48 / 7:46 · HR 142 → 159 · CD 9:07 @ 153","pill":{"cls":"p-warn","text":"good session, two tweaks"},"html":"<p>Good to be back out four days after the calves went, and moving well: 7:48s at marathon heart rate, with a real cool-down mile at the end. Solid session for a pull-back week — and the fact that you could run it at all says the calf thing was a bad morning, not an injury.<\/p><p>Two things to tighten, both small, both yours. <strong>The block:<\/strong> it was written as three miles at 150–155 because the point wasn't the work, it was the feel. You had two miles right in it (151, 154), then mile five drifted to 159. Understandable — that's where legs go when they feel good. The skill is noticing the drift at 156 and easing off before it reaches 159, because that instinct at mile 18 on Nov 1 is worth more than any workout. Next time the top rung says 150–155: sit in it, get bored in it, memorize it. <strong>The warm-up:<\/strong> one mile instead of two. Normally not worth mentioning — but four days after both calves cramped, that second mile is cheap insurance. Take it.<\/p><p>Two things I still need: how the calves feel now, and what you drank on Friday's run — water only, or something with sodium? Saturday's 13 is the first long run where sodium is part of the plan, and I want to know the starting point.<\/p>"},{"date":"Fri Sep 4","title":"Long run — 12 of 16, stopped for the calves","nums":"12.01 mi · 8:51 · 143 avg HR · max 157 · 335 ft · 73°F / 92% humidity · 5:50 AM","pill":{"cls":"p-warn","text":"right call, real lesson"},"html":"<p>You called this a fuck-up. It wasn't. Read the heart-rate column: no mile above 153 on a hilly route in 92% humidity — the best-controlled long run you've ever done, and the first one where the fade wasn't you pushing. Then both calves started going at 11 and you <strong>stopped<\/strong>. In 2023 and 2024 you felt exactly that and battled through, and it cost you half an hour each time. Today you did the opposite. That is the entire point of this build, and you did it under pressure with no one watching.<\/p><p>What actually went wrong is mechanical, and every piece of it is fixable: you slept 6:10 (the 7-hour rule missed both nights); you had essentially zero sodium — Maurten gels carry none — on a 92% morning at 217 lb; and your calves got their first hills twice in 36 hours because Wednesday's miss pushed Thursday's run onto the day before the long run. That last one is on me: Thursday should have been flat. The heat alone turns 8:51 at 143 into roughly an 8:20 cool-day run. Your fitness was never the problem today.<\/p><p><strong>What changes:<\/strong> Naples is off — walk, don't run, until Monday. Sodium goes in on every run over 75 minutes, no exceptions. Hills once a week, never the day before a long run. And the long runs are re-sequenced: 13 next Saturday (pull-back week, on purpose), then 16, 18, a 14, and the 20 on Oct 10. Nothing about Nov 1 changed. You just found the failure two months early, on a Friday in Hackensack, instead of on the Queensboro.<\/p><p>Fueling update: three Maurten 160s is about 68g an hour — the closest you've ever run to the target, and your gut handled it. Carbs weren't the problem today; that leaves sodium, sleep, and the stacked hills, and all three are yours to fix. Still tell me what you drank. And if either calf is tight this weekend, say so before you run Monday.<\/p>"},{"date":"Thu Sep 3","title":"Easy 4 · moved from Wednesday","nums":"4.29 mi · 8:22 · 138 avg HR · 217 ft · 8:51 AM","pill":{"cls":"p-good","text":"right call"},"html":"<p>Wednesday fell apart and you said so the same day — that's exactly how this works, and moving the run to Thursday morning instead of stacking it was the right call. Hills on an easy run: good. The mile-3 tempo surge to 157: not good. Easy runs don't have tempo sections, even short ones — save every surge for the days that are built for them.<\/p><p>Cost of the swap: your rest day before the 16 is spent. So tonight has one job — 7+ hours. Tomorrow: 16 before 9 AM, before you travel. Two gels an hour, race products, sodium, carbs today. Two or three bridge-grade climbs mid-run. Cap 152, finish under 155, and eat and drink properly before the flight.<\/p>"},{"date":"Tue Sep 1","title":"7 mi — the progression you ran instead of the intervals I wrote","nums":"8:55 → 7:52 → 7:30 → 7:22 → 7:22 → 7:11 → 8:51 CD · HR 122→161","pill":{"cls":"p-warn","text":"great run, wrong session"},"html":"<p>Let's be precise about both halves. The session was 2 up, 4 miles at 165–172, 1 down. You ran 1 up, a five-mile continuous build from 7:52 to 7:11 with heart rate climbing 136 to 161 — which never actually reaches the threshold zone — and a cool-down. That's the third quality day in a row rewritten on the fly.<\/p><p>And: it was beautifully run. You respected the ceiling with room to spare, no Zone 5, and you did a real cool-down mile for the first time. You're clearly at your best running smooth ladders, so from now on quality days will be written that way — as heart-rate ladders with a top rung. When the top rung says 165–172, that rung is the session. Deal?<\/p><p>Now the number that matters: <strong>7:22 per mile at 151–156 — that's marathon-effort heart rate.<\/strong> The race plan currently says 8:55 on the flats. We decide after Friday's 16, but understand what you just showed: the plan's pace floor is not your fitness ceiling, not even close.<\/p>"},{"date":"Mon Aug 31","title":"Easy 6 · evening","nums":"6.0 mi · 9:30/mi · ~125 avg HR · 97% Z1","pill":{"cls":"p-good","text":"four in a row"},"html":"<p>119–129 the whole way, dead flat, 97% Zone 1. Fifth consecutive run executed as written. Correction from last night: this showed up as a treadmill 5 with no pace before Strava finished syncing — it was your outdoor 6 all along, and 9:30 at 125 sits exactly where it should next to Thursday's 8:36 at 135. Same engine, lower dial.<\/p>"},{"date":"Sat Aug 29","title":"15.2 long — longest of the build","nums":"15.2 mi · 8:35 avg · ~136 avg HR · 6:05 AM start","pill":{"cls":"p-good","text":"every rule met"},"html":"<p>This is the run we've been asking for. Started at 6:05, opened at 9:11, worked down to 8:17s, and heart rate never averaged above 149 for a full mile — final 0.2 at 152, inside the finish cap. Negative split by design, controlled by HR the whole way. Three long runs in a row you raced the back half; this time you ran it like a race rehearsal. This is the standard now.<\/p><p>Ignore what Whoop says about this run. The wrist sensor locked onto your step cadence and read 160+ for two hours while the strap read 120s–140s — the 20.1 strain and the Z4 time are junk, and tomorrow's recovery score will be skewed by it. The strap is the truth on runs, and today proved why we switched.<\/p><p>What it means: 8:35 at ~136 HR says marathon-effort pace is faster than the current plan assumes. We decide after the 16 on Sep 5, not today.<\/p><p><strong>The one miss was fueling.<\/strong> Three Stinger gels over 2:12 is about 33g of carbs an hour — the prescription is 80. The Vitargo preload and the easy heart rate covered for it this time; at marathon effort on Nov 1 it won't, and mile 21 is where that bill arrives. Your gut has to be trained to absorb 80g/hr and that takes weeks of practice, which is why every long run from the 16 onward runs the full protocol: 2 gels per hour, race products, sodium in the mix, no substitutions. Water-only for two-plus hours in August also works exactly once — at 6 AM, at easy HR. Not at race effort.<\/p><p>\"Could've gone 2 more\" — that's the right feeling to finish with, and the answer is still no. The plan says 16 next Saturday; finishing with something left is the point, not a sign to spend it.<\/p><p>Still need one number: hours slept Thursday and Friday nights.<\/p>"},{"date":"Thu Aug 27","title":"Easy 6","nums":"6.04 mi · 8:36 avg · 135 avg HR · 12:20 PM · 79°F","pill":{"cls":"p-good","text":"easy, again"},"html":"<p>Splits 8:55 → 8:31 → 8:32 → 8:36 → 8:29 → 8:26, every mile well under the 150 cap, no drift. Compare with yesterday: 9:56 at 125–130, today 8:36 at 135. Same effort band, much faster. That is what fresh legs under a respected ceiling look like, and it is the whole argument for running easy days easy.<\/p><p>Heart rate here is from the chest strap, the first run recorded with it. Wear the Whoop too on Saturday so we can compare. Still a noon start; fine for 50 minutes, not for Saturday.<\/p>"},{"date":"Wed Aug 26","title":"Easy 5 · recovery","nums":"49:42 · 84% Z1 · max ~152 (brief)","pill":{"cls":"p-good","text":"first correct easy day on record"},"html":"<p>120s–130s the whole way, no drift, no back-half push. Nothing above a one-off blip. This is what every easy run should look like from here. Only nit: 3 PM again.<\/p>"},{"date":"Tue Aug 25","title":"8 mi threshold session","nums":"1:02 · 7:45 avg · 146 avg / 172 max · Weehawken track","pill":{"cls":"p-warn","text":"work block ran long"},"html":"<p>Structure from the HR trace: ~19 min warm-up at 125–130, then ~43 min continuous climbing 150 → 163 → 163–170 plateau, peak 172, hard stop, no cool-down. Implied work pace ~7:25 for ~6 miles.<\/p><ul><li>Stopped at 172 exactly. That's the first cap respected in the record. Credit it.<\/li><li>Work block was 6 miles against 3–5 prescribed, and half of it was 150–162, not threshold; HR crept up to the cap instead of sitting in it. That's what 3:30 PM in August does.<\/li><li>Whoop showed 1,142 ft of elevation on a flat track. Whoop elevation is not usable.<\/li><\/ul>"},{"date":"Sun Aug 23","title":"14.0 mi long run · longest ever","nums":"8:43 avg · 147 avg / 169 max · 12:13 PM start","pill":{"cls":"p-flag","text":"raced the finish"},"html":"<p>Negative split (8:58 → 8:17 by mile 11, last 3 under 8:35, no fade) and mile 12 was 26 s faster than three weeks earlier. Cool-equivalent ~8:10–8:15 at marathon HR. That closed the fitness question.<\/p><ul><li>HR climbed to 165–168 in the final 25 minutes: third straight long run raced in the back half. From here, long-run finishes are capped at 155.<\/li><li>Started at noon in August. Long runs move before 9 AM.<\/li><li>Slept 4.5 h that night; recovery 28% the next morning.<\/li><li>Fuel intake for this run still unknown.<\/li><\/ul>"},{"date":"Sun Aug 16","title":"12.2 mi long run","nums":"8:20 avg · 152 avg / 169 max · 10:30 AM · ~80°F","html":"<p>Faded 7:56 (mi 7) → 8:49 (mi 12). First read was fitness loss; heat-adjusted, 8:20 in that weather is ~7:48 cool-equivalent at the same HR, so fitness was intact. The fade was heat plus probable under-fueling.<\/p>"},{"date":"Aug 14","title":"Lab VO2max / RMR test","pill":{"cls":"p-flag","text":"not used"},"html":"<p>Reported VO2max 31.4 and HRmax 156. Neither is compatible with a 1:43 half at 191 max HR. No numbers from this test are used anywhere in the plan. Field data beats lab data.<\/p>"},{"date":"Sun Apr 26","title":"Brooklyn Half · 1:43:22 PR","nums":"7:35 avg · 167 avg / 191 max · 46°F","pill":{"cls":"p-good","text":"anchor race"},"html":"<p>8:21 opener, 7:50s through 8, then 7:16–7:28, 6:34 kick. HR rose as pace rose: pushing, not fading. This race anchors every fitness estimate in this document.<\/p>"}]},"race":{"title":"Race plan · NYC, Nov 1 (v2)","intro":"<p>Pace targets are in flat-equivalent terms; HR is the governor. Under review: 8:50–8:55 on the flats given the Aug 23 run. Decision after the 16 on Sep 5. The course profile at the top of the page is this table, drawn.<\/p>","rows":[{"miles":"1–2","section":"Verrazzano","pace":"9:20","hr":"≤148","notes":"Uphill, crowded, cold. Give the time away here on purpose."},{"miles":"3–8","section":"Brooklyn","pace":"9:00","hr":"≤150","notes":"Loudest crowds on the course. Don't take the bait."},{"miles":"9–13","section":"Brooklyn → Pulaski","pace":"8:55","hr":"150–153","notes":"Half split 1:55–1:57."},{"miles":"14–16","section":"Queensboro → 1st Ave","pace":"9:00","hr":"≤155","notes":"Bridge is silent and uphill; 1st Ave is downhill noise. Hold effort, not pace. This is where '23 and '24 broke — gel before the bridge, short stride up it, sodium on schedule."},{"miles":"17–20","section":"Bronx","pace":"8:55","hr":"≤155","notes":"Decision point at 20."},{"miles":"21–26.2","section":"5th Ave → Central Park","pace":"8:50 →","hr":"open","notes":"If HR was under 152 at 20, push. 5th Ave climbs (23–24); the park rolls."}],"fixed":["Chest strap, not wrist, for HR.","2 gels/hr from mile 4; on-course Gatorade Endurance only if practiced on a long run.","Hills are rehearsed: from Sep 5 every long run includes bridge-grade climbs — the 18s and the 20 put them at miles 13–16 on tired legs.","Breakfast, shoes, shorts, and start-time routine all rehearsed on the last three long runs.","Visualization and confidence work in the final three weeks; details added at taper."]},"open":{"title":"Open items","items":["<strong>Chest strap<\/strong> is in use as of Aug 27, paired to the Strava app. Record every run in Strava with it. Wear the Whoop alongside for the next two weeks so we can compare the two, and expect the strap to confirm HRmax the first time you race a finish.","<strong>What did you fuel with on Aug 23?<\/strong> Decides whether the Aug 16 fade was heat or fueling.","<strong>Race-plan revision<\/strong>: hold conservative or move flats to 8:50–8:55. Decision after the 16 on Sep 5.","<strong>Strava splits<\/strong> for the Aug 25 work block.","<strong>Bloodwork<\/strong> (fasting glucose, HbA1c, lipids): low priority, cheap to check, your doctor's call.","<strong>Which bridge was it?<\/strong> The course never touches the Brooklyn Bridge — Pulaski (halfway) or Queensboro (mile 16)? And what were you fueling with in '23 and '24?","<strong>From Friday's run:<\/strong> Maurten 160s — confirmed, ~68g/hr, closest yet to the target. What did you drink, and was there any sodium in it? How are the calves Saturday and Sunday?"]},"changelog":{"title":"Changelog","items":[{"date":"Sep 18","html":"Whoop cross-check on Thursday's ladder: wrist trace flat-lined at ~147 throughout — unusable. Paces remain unverified; the Sep 26 fifteen-miler at ≤152 is the test."},{"date":"Sep 17","html":"Thursday MP ladder reviewed: 2/3/1 run exactly as written for the first time; block HR 148–155 but paces 7:07–7:20 in 84°F don't reconcile with his curve — strap suspected of reading low. Whoop cross-check requested before any race-plan use."},{"date":"Sep 16","html":"Wednesday easy 5 reviewed and marked done — 131 avg, max 142, under the cap throughout."},{"date":"Sep 14","html":"John asked for +1–2 mi on long runs; declined. The Oct 10 peak is 18 by default and becomes 20 if the weeks of Sep 21 and 28 are both complete. Page now hosted at a permanent GitHub Pages link."},{"date":"Sep 14","html":"Missed 13 run on Monday instead of the easy 5 — even splits, capped, titled \"13 under 155.\" Tuesday off; MP ladder moved to Thursday; Saturday cut to 8 easy. Long runs re-sequenced: 15, 17, 18 peak; the 20 dropped."},{"date":"Sep 13","html":"Week of Sep 7: two runs, Saturday 13 missed (too busy). Sunday evening 7.25 reviewed — best pace-at-HR on record. Long runs re-sequenced: 14 → 16 → 18 → 20 (provisional) → Oct 17 half. Week of Sep 14 added: five runs, 14 long, pinned."},{"date":"Sep 8","html":"Tuesday MP-effort touch reviewed: 4 @ 7:48, two miles in the 150–155 rung, last mile drifted to 159; warm-up short by a mile. Good session, two tweaks."},{"date":"Sep 4","html":"Fueling confirmed for Friday: 3 × Maurten 160 ≈ 68g/hr — first long run near race dosing. Carbs ruled out as the cause of the calf stop."},{"date":"Sep 4","html":"Long run reviewed: 12 of 16, stopped with both calves going — correct decision; HR discipline the best on file. Causes: 6:10 sleep, no sodium, hills two days running, 92% humidity. Saturday made off/walk; long runs re-sequenced (13 pull · 16 · 18 · 14 pull · 20); sodium rule and hill-spacing rule added."},{"date":"Sep 3","html":"Wednesday marked missed (flagged same-day); easy 4 run Thursday morning instead — 4.29 @ 8:22, 138 avg, with hills. The 16 stays Friday, full protocol."},{"date":"Sep 1","html":"Oct 17 confirmed: NYCRUNS Falling Leaves Half, Prospect Park, 7:30 AM start. Loop course with a climb every lap — the dress rehearsal now doubles as bridge-cramp rehearsal under fatigue."},{"date":"Sep 1","html":"Oct 17 half added to the plan as the marathon dress rehearsal at MP effort (150–155) — replaces that week's 14-mi pull-back. Not a race; possibly the last 2 mi open for HRmax. Registration/course to confirm."},{"date":"Sep 1","html":"Monday corrected (outdoor 6 @ 9:30, not a treadmill 5 — Strava sync glitch). Tuesday 7-mi progression reviewed: cap respected, threshold zone never reached; quality days now prescribed as HR ladders. 7:22/mi at marathon-effort HR noted."},{"date":"Aug 31","html":"Monday easy 5 reviewed and marked done — fourth consecutive run to prescription. Pace missing (treadmill); asked for incline/walk details."},{"date":"Aug 29","html":"Week of Aug 31 rebuilt around the Naples trip: long run moves to Friday (16, before travel), Monday easy 6 added, Saturday becomes a short heat-capped shakeout. John's draft (~42 mi) trimmed to ~37 — threshold stays 7 not 8–9, Wednesday stays 4, long run stays 16."},{"date":"Aug 29","html":"Marathon PR corrected against official results: 4:32:25 both years (not 4:24:32 — digits transposed in memory), registered as John Malone Jr. Full-field analysis: 7 exact-time repeaters out of 8,426 who ran '23 and '24; ~1 in 2,500 across NYC history."},{"date":"Aug 29","html":"The 4:24s decoded: both races failed identically — groin cramp off a bridge climb, then full cascade. Plan change: bridge-grade climbs in every long run from Sep 5; mile 14–16 race notes updated; adductor work added to one lift."},{"date":"Aug 29","html":"Record corrected: this is John's third NYC, not his first marathon — 4:24:32 finishes in 2023 and 2024 (identical times, confirmed against Whoop race-day data). Marathon PR added; \"longest ever\" wording fixed."},{"date":"Aug 29","html":"“Where we are” rewritten around the 64-days-out picture: engine closed, six long runs left, the work is rehearsal of controllables, not building."},{"date":"Aug 29","html":"New section: <em>The prediction<\/em> — Vickers–Vertosick estimate (3:52, band 3:37–4:08) from the Brooklyn Half + current mileage. Same model now runs on every athlete’s page."},{"date":"Aug 29","html":"Fueling report for the 15.2 logged: ~33g carbs/hr vs the 80g/hr target, water only. Full race dosing is mandatory on every long run starting with the 16 on Sep 5."},{"date":"Aug 29","html":"Saturday 15.2 reviewed and marked done — longest run of the build, first fully compliant long run. Whoop wrist HR for the run flagged as cadence-lock artifact; strap data used."},{"date":"Aug 27","html":"Thursday easy 6 reviewed and marked done."},{"date":"Aug 27","html":"Course profile replaced with the real findmymarathon.com elevation (966 ft gain; Verrazzano peaks at 263 ft, Queensboro ~150, 5th Ave/park ~110). \"Approximate\" label removed."},{"date":"Aug 27","html":"Page moved onto the shared Lane 8 template (one template for every athlete; content lives in page.json). No content changes."},{"date":"Aug 27","html":"Restyled to the Lane 8 colorway (yellow/black, matching Anni's page). Page rebuilt: live countdown, course profile with the race plan, four charts from the Whoop export, long-run progression. Three-week calendar issued (15.2 / 16 / pull-back 12). Thursday changed from 10 to 6 easy; Thursday threshold request declined (second quality day in 48 h, two days before the long run). Aug 26 easy run reviewed."},{"date":"Aug 26","html":"Full Whoop export reviewed (Aug 2023 → present). Findings on easy-run HR, running frequency, lifting volume, and sleep added. Event dates corrected from Whoop timestamps (Brooklyn Half Apr 26; 12-mi Aug 16; 14-mi Aug 23)."},{"date":"Aug 25","html":"Threshold session reviewed. Next threshold format set: 2 WU / 4 @ 165–172 / 1 CD."},{"date":"Aug 22","html":"Race plan v2. Long-run finish cap ≤155. Long runs moved before 9 AM. Sub-4 odds ~85/15, target 3:48–3:52."}]},"prediction":{"title":"The prediction","toc":"Prediction","intro":"<p>New on this page: a finish-time estimate from the Vickers–Vertosick model — built from a study of 493 marathoners, it predicts marathon time from a recent race plus weekly mileage. Inputs here: the Brooklyn Half (1:43:22) and current volume, ~27 mi/wk averaged over the last four weeks.<\/p>","cards":[{"cls":"","k":"Model estimate","v":"3:52","s":"from 1:43:22 + 27 mi/wk"},{"cls":"easy","k":"68% band","v":"3:37–4:08","s":"±16 min — marathons are noisy"},{"cls":"mp","k":"Goal","v":"Sub-4:00","s":"~8 min inside the estimate"}],"center_s":13942,"band_s":[12992,14892],"goal_s":14400,"goal_label":"sub-4","basis":["Sub-4 sits ~8 minutes inside the estimate — likely, not guaranteed. The slow edge of the band (4:08) is what an interrupted build looks like; the plan exists to make that edge irrelevant.","Mileage is the lever the model prices directly: every +10 mi/wk sustained is worth ~3 minutes. The 4–5 runs/week build already on the plan moves the estimate toward 3:48.","It agrees with the coach read from 8/22 (realistic 3:48–3:52). And the 8/29 long run — 8:35 average at 136 HR — is exactly the kind of evidence that eventually beats a population model."],"outro":"Nothing here changes the plan: frequency up, easy runs easy, 80g/hr on every long run from the 16 on Sep 5, 7+ hours of sleep the two nights before. The estimate follows the training — not the other way around."}},"footer":"Source files (run screenshots, Whoop export, training log) live in the Lane 8 folder. This page is the shared view; it's rewritten from those files, not the other way around. Course elevation traced from findmymarathon.com (course updated 7/8/2026); for pacing context.","public_url":"https://themesong.github.io/lane8-pages/john-malone-nyc-2026.html"}</script>
<script>/* Lane 8 Track Club · athlete page renderer
   Reads the JSON in <script id="page-data"> and builds the whole page.
   Athlete-specific content lives ONLY in page.json. Change this file to change every athlete's page. */
(function(){
const P=JSON.parse(document.getElementById('page-data').textContent);
const $=(s,r=document)=>r.querySelector(s);
const NS='http://www.w3.org/2000/svg';
const el=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)if(a[k]!==undefined)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
const txt=(p,a,s)=>{const t=el('text',a,p);t.textContent=s;return t;};
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const mmss=s=>{s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const j=(a,f)=>(a||[]).map(f).join('');
const pill=(cls,t)=>t?`<span class="pill ${cls}">${t}</span>`:'';
const R=P.race||{};const DIST=R.distance||26.2;

/* ================= MARKUP ================= */
const S=P.sections||{};
const sec=(id)=>S[id]||{};
const order=P.section_order||['status','data','prediction','rules','zones','calendar','road','reviews','race','open','changelog'];
const present=order.filter(id=>S[id]);

function figMarkup(f){
  const body=f.kind==='zonebars'?`<div class="zbars" id="${f.id}-bars"></div>`:`<svg viewBox="0 0 ${f.w||760} ${f.h||FIG_H[f.kind]||240}"></svg>`;
  return `<div class="fig" id="${f.id}"><p class="ft">${f.title||''}</p>${f.sub?`<p class="fs">${f.sub}</p>`:''}${body}${legendMarkup(f)}</div>`;
}
const FIG_H={halves:250,monthly_hr:230,start_split:250,hr_dots:240,weekly_minutes:220,sleep_recovery:240,longrun:230};
function legendMarkup(f){
  const L=f.legend===undefined?DEFAULT_LEGEND[f.kind]&&DEFAULT_LEGEND[f.kind](f):f.legend;
  if(!L||!L.length)return '';
  return `<div class="legend">${L.map(i=>{
    if(i.cls)return `<span><i class="${i.cls}"></i>${i.label}</span>`;
    if(i.dash)return `<span><i style="background:transparent;border-top:2px dashed var(--ink-3);height:0;vertical-align:3px"></i>${i.label}</span>`;
    return `<span><i style="background:var(${i.color})"></i>${i.label}</span>`;}).join('')}</div>`;
}
const DEFAULT_LEGEND={
  halves:()=>[{color:'--z-easy',label:'First half'},{color:'--accent',label:'Second half'}],
  monthly_hr:f=>{const c=f.cap||155;return[{color:'--z-easy',label:`Month at or under ${c}`},{color:'--accent',label:`Over ${c}`},{dash:1,label:`Easy cap ${c}`}]},
  start_split:()=>[{color:'--z-easy',label:'Negative split'},{color:'--accent',label:'Positive split'}],
  zonebars:()=>[1,2,3,4,5].map(z=>({cls:'z'+z,label:'Z'+z})),
  hr_dots:f=>{const c=f.cap||150;return[{color:'--z-easy',label:`At or under ${c}`},{color:'--bad',label:`Over ${c}`},{dash:1,label:`Easy cap ${c}`}]},
  weekly_minutes:()=>null,
  sleep_recovery:()=>[{color:'--good',label:'Green (67+)'},{color:'--warn',label:'Yellow (34–66)'},{color:'--bad',label:'Red (&lt;34)'}],
  longrun:()=>[{color:'--z-easy',label:'Done'},{cls:'o',label:'Planned'},{color:'--warn',label:'Pull-back week'}]
};

const SECTION={
  status:s=>s.html||'',
  data:s=>(s.intro||'')+j(s.figures,figMarkup),
  prediction:s=>(s.intro||'')
    +(s.cards?`<div class="zones">${j(s.cards,c=>`<div class="zone ${c.cls||''}"><div class="k">${c.k}</div><div class="v">${c.v}</div><div class="s">${c.s||''}</div></div>`)}</div>`:'')
    +(s.center_s?`<div class="fig" id="pred-band"><p class="ft">${s.band_title||'Where the estimate lands'}</p><svg viewBox="0 0 760 132"></svg></div>`:'')
    +(s.basis?`<ul class="plain">${j(s.basis,b=>`<li>${b}</li>`)}</ul>`:'')
    +(s.outro?`<p style="margin-top:12px;font-size:14px;color:var(--ink-2)">${s.outro}</p>`:''),
  rules:s=>j(s.items,r=>`<div class="rule"><strong>${r.strong}</strong> ${r.text}</div>`),
  zones:s=>(s.intro||'')+`<div class="zones">${j(s.cards,c=>`<div class="zone ${c.cls||''}"><div class="k">${c.k}</div><div class="v">${c.v}</div><div class="s">${c.s||''}</div></div>`)}</div>`,
  calendar:s=>{
    const legend=`Legend: ${pill('p-easy','easy')} ${pill('p-mp','marathon effort')} ${pill('p-thr','threshold')} ${pill('p-off','off')}`;
    const intro=s.intro?`<p>${s.intro} ${legend}</p>`:`<p>${legend}</p>`;
    const weeks=j(s.weeks,w=>`<div class="wk"><h3>${w.title}</h3><span class="tot">${w.tot||''}</span></div>
  <div class="tbl"><table><thead><tr><th>Day</th><th>Run</th><th>HR</th><th>Notes</th><th>Done</th></tr></thead><tbody>${j(w.rows,r=>{
      const cls=[r.key?'key':'',(w.pull||r.pull)?'pull':''].filter(Boolean).join(' ');
      const done=r.done===true?pill('p-good','done'):r.done===false?pill('p-flag','missed'):(r.done||'');

/* shared tooltip */
function mkTip(fig){const t=document.createElement('div');t.className='tip light';fig.appendChild(t);return{
  show(ev,html){t.innerHTML=html;const r=fig.getBoundingClientRect();t.style.left=(ev.clientX-r.left)+'px';t.style.top=(ev.clientY-r.top-8)+'px';t.classList.add('on');},
  hide(){t.classList.remove('on');}};}
const hover=(node,tip,html)=>{node.addEventListener('mousemove',ev=>tip.show(ev,html));node.addEventListener('mouseleave',tip.hide);};
/* generic annotations: [{x,y,text,anchor,dx,dy}] in data coords */
const annots=(svg,list,x,y)=>(list||[]).forEach(a=>txt(svg,{x:x(a.x)+(a.dx||0),y:y(a.y)+(a.dy===undefined?4:a.dy),'text-anchor':a.anchor||'start',class:'ann'},a.text));
const gridY=(svg,vals,x1,x2,y,fmt=v=>v,L)=>{const g=el('g',{class:'grid'},svg);vals.forEach(v=>{el('line',{x1,x2,y1:y(v),y2:y(v)},g);txt(svg,{x:L-8,y:y(v)+4,'text-anchor':'end'},fmt(v));});return g;};

const KINDS={
  /* first half vs second half per race: data [[name, secPerMiFirst, secPerMiSecond, note]] */
  halves(f,svg,tip){const D=f.data,W=760,H=250,L=46,Rr=12,T=16,B=44,pw=W-L-Rr,ph=H-T-B;
    const lo=f.lo||420,hi=f.hi||720,y=v=>T+ph*(1-(v-lo)/(hi-lo));gridY(svg,f.ticks||[450,510,570,630,690],L,W-Rr,y,mmss,L);
    const gw=pw/D.length,bw=Math.min(30,gw*.3);

        const rect=el('rect',{x:cx+b[2],y:y(b[0]),width:bw,height:y(lo)-y(b[0]),rx:3,fill:b[1]},svg);hover(rect,tip,`<b>${r[0]} · ${b[3]}</b>${mmss(b[0])}/mi · ${r[3]||''}`);
        txt(svg,{x:cx+b[2]+bw/2,y:y(b[0])-5,'text-anchor':'middle'},mmss(b[0]));});

    el('line',{x1:L,x2:W-Rr,y1:y(lo),y2:y(lo),stroke:css('--line')},svg);},

  /* median easy-run HR by month: data [[label, median, pctOver]] */
  monthly_hr(f,svg,tip){const D=f.data,W=760,H=230,L=46,Rr=12,T=16,B=34,pw=W-L-Rr,ph=H-T-B,cap=f.cap||155;
    const lo=f.lo||148,hi=f.hi||164,y=v=>T+ph*(1-(v-lo)/(hi-lo));gridY(svg,f.ticks||[150,155,160],L,W-Rr,y,v=>v,L);
    const gw=pw/D.length,bw=Math.min(34,gw*.6);
    D.forEach((m,i)=>{const cx=L+gw*i+gw/2,over=m[1]>cap;const rect=el('rect',{x:cx-bw/2,y:y(m[1]),width:bw,height:y(lo)-y(m[1]),rx:3,fill:over?css('--accent'):css('--z-easy')},svg);
      hover(rect,tip,`<b>${m[0]}</b>median ${m[1]} bpm · ${m[2]}% ${f.pct_label||'of easy miles over cap'}`);txt(svg,{x:cx,y:y(m[1])-6,'text-anchor':'middle'},m[2]+'%');txt(svg,{x:cx,y:H-B+16,'text-anchor':'middle'},m[0]);});
    el('line',{x1:L,x2:W-Rr,y1:y(cap),y2:y(cap),stroke:css('--ink-3'),'stroke-dasharray':'4 4','stroke-width':1.5},svg);el('line',{x1:L,x2:W-Rr,y1:y(lo),y2:y(lo),stroke:css('--line')},svg);},

  /* long-run start time vs second-half delta: data [[date, startHourDecimal, firstMilesHR, secPerMiDelta]] */
  start_split(f,svg,tip){const D=f.data,W=760,H=250,L=46,Rr=12,T=18,B=36,pw=W-L-Rr,ph=H-T-B;

    el('line',{x1:x(rs),x2:x(rs),y1:T,y2:y(ymn),stroke:css('--ink'),'stroke-dasharray':'4 4'},svg);txt(svg,{x:x(rs)+6,y:T+10,class:'ann'},(rs>12?rs-12+' PM':rs+' AM')+' — race start');

      hover(c,tip,`<b>${r[0]}</b>start ${Math.floor(r[1])}:${String(Math.round((r[1]%1)*60)).padStart(2,'0')} · first 3 mi HR ${r[2]} · 2nd half ${r[3]>0?'+':''}${r[3]} s/mi`);});

  /* time-in-zone bars: data [[dateLabel, runName, [z1..z5 pct], tag]] */
  zonebars(f,box){const D=f.data;D.forEach(([d,n,z])=>{

    annots(svg,f.annotations,x,y);},

  /* minutes per week: data [[weekLabel, minutes]]; month_marks [[index,label]] */
  weekly_minutes(f,svg,tip){const D=f.data,W=760,H=220,L=40,Rr=12,T=14,B=30,n=D.length,bw=(W-L-Rr)/n,max=f.max||340;

      const rect=el('rect',{x:x0,y:y(v),width:bw-2,height:h,rx:3,fill:last?css('--z-easy-soft'):css('--z-easy'),stroke:last?css('--z-easy'):'none','stroke-dasharray':last?'3 2':'none'},svg);
      if(h>0)el('rect',{x:x0,y:y(0)-2,width:bw-2,height:2,fill:last?css('--z-easy-soft'):css('--z-easy')},svg);hover(rect,tip,`<b>week of ${w}</b>${v} min${last?' · in progress':''}`);});
    (f.month_marks||[]).forEach(([i,n])=>txt(svg,{x:x(i)+1,y:H-8},n));
    annots(svg,f.annotations,i=>x(i)+bw/2,y);},

  /* sleep vs recovery: data [[sleepMinutes, recoveryPct, label?]] */
  sleep_recovery(f,svg,tip,fig){const D=f.data,W=760,H=240,L=40,Rr=12,T=14,B=30,hmin=f.hmin||3.5,hmax=f.hmax||8.5,bad=f.bad_under_h||6;
    const x=m=>L+(m/60-hmin)/(hmax-hmin)*(W-L-Rr),y=v=>T+(1-v/100)*(H-T-B);gridY(svg,[0,33,66,100],L,W-Rr,y,v=>v+'%',L);
    for(let h=Math.ceil(hmin);h<=hmax;h++){el('line',{x1:x(h*60),x2:x(h*60),y1:T,y2:H-B,stroke:css('--grid')},svg);txt(svg,{x:x(h*60),y:H-8,'text-anchor':'middle'},h+'h');}
    el('rect',{x:L,y:T,width:x(bad*60)-L,height:H-T-B,fill:css('--bad'),opacity:.06},svg);txt(svg,{x:x(bad*60)-8,y:T+14,'text-anchor':'end',class:'ann'},'under '+bad+' h');

  longrun(f,svg,tip){const D=f.data,W=760,H=230,L=40,Rr=12,T=16,B=40,n=D.length,bw=(W-L-Rr)/n,pad=f.pad||6,max=f.max||27;

/* prediction band bar: times in seconds, smaller = faster = left */

  el('line',{x1:L,x2:W-Rr,y1:yc,y2:yc,stroke:css('--line'),'stroke-width':1.5},svg);
  const b=el('rect',{x:x(s.band_s[0]),y:yc-14,width:x(s.band_s[1])-x(s.band_s[0]),height:28,rx:5,fill:css('--z-easy-soft'),stroke:css('--z-easy'),'stroke-width':1.5},svg);
  hover(b,tip,`<b>68% band</b>${F(s.band_s[0])}\u2013${F(s.band_s[1])} \u00b7 two of three runners land inside`);
  txt(svg,{x:x(s.band_s[0]),y:yc+34,'text-anchor':'middle'},F(s.band_s[0]));
  txt(svg,{x:x(s.band_s[1]),y:yc+34,'text-anchor':'middle'},F(s.band_s[1]));
  el('line',{x1:x(s.center_s),x2:x(s.center_s),y1:yc-24,y2:yc+24,stroke:css('--ink'),'stroke-width':2.5},svg);
  txt(svg,{x:x(s.center_s),y:yc-32,'text-anchor':'middle','font-weight':'700','font-size':'13',class:'ann'},F(s.center_s)+' estimate');
  if(s.goal_s!==undefined){el('line',{x1:x(s.goal_s),x2:x(s.goal_s),y1:yc-24,y2:yc+24,stroke:css('--accent'),'stroke-width':2.5,'stroke-dasharray':'5 3'},svg);
    txt(svg,{x:x(s.goal_s),y:yc+52,'text-anchor':'middle',class:'ann',style:'fill:var(--accent);font-weight:700'},(s.goal_label||'goal')+' '+F(s.goal_s));}
})();
})();
</script>
